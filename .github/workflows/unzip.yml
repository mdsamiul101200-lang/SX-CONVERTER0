name: Unzip SX Converter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip SX Converter
        run: |
          unzip -o "SX-CONVERTER-RENDER-READY-FIXED.zip" -d extracted

      - name: Move Extracted Files to Repository Root
        run: |
          shopt -s dotglob

          if [ -d "extracted/SX-CONVERTER-RENDER-READY-FIXED" ]; then
            cp -R extracted/SX-CONVERTER-RENDER-READY-FIXED/* .
          else
            cp -R extracted/* .
          fi

      - name: Remove ZIP and Temporary Folder
        run: |
          rm -rf extracted
          rm -f "SX-CONVERTER-RENDER-READY-FIXED.zip"

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract SX Converter project"
            git push
          fi
